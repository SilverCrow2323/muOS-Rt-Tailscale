name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl git python3 binutils
      - name: Build muOS archive
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Rt:Tailscale-M release
          generate_release_notes: true
          files: |
            dist/*.muxapp
            dist/*.sha256
