name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit shellcheck python3-pyflakes python3-qrcode python3-opencv love xvfb
      - name: Run project checks
        run: RTTS_SKIP_UI_SMOKE=1 bash tests/run_all.sh
